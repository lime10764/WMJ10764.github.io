<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介绍 - 覃凌入口</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            background: url('https://cdn.jsdelivr.net/gh/lime10764/WMJ10764.github.io@main/image_download_1787389320083.jpg
') center/cover no-repeat fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 24px;
            padding: 36px;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12),
                        inset 0 1px 0 rgba(255, 255, 255, 0.35);
            text-align: center;
        }

        .title {
            font-size: 1.6em;
            color: #fff;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 28px;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
        }

        .name {
            font-size: 1.5em;
            color: #fff;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .role {
            font-size: 0.88em;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 18px 20px;
            border-radius: 14px;
            margin: 20px 0;
            text-align: left;
            color: #fff;
        }

        .info-item {
            margin: 10px 0;
            font-size: 0.9em;
            display: flex;
            align-items: center;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.55);
            min-width: 60px;
            font-weight: 500;
        }

        .info-value {
            color: #fff;
        }

        .description {
            font-size: 0.9em;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.82);
            text-align: left;
            margin: 20px 0;
        }

        .description p {
            margin: 8px 0;
        }

        .description ul {
            margin: 8px 0 8px 18px;
        }

        .description li {
            margin: 4px 0;
        }

        .back-button {
            position: relative;
            overflow: hidden;
            margin-top: 24px;
            padding: 13px 32px;
            font-size: 0.9em;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .back-button:active {
            transform: scale(0.94);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.28);
        }

        .back-button.bounce {
            animation: bounceBack 0.35s ease;
        }

        @keyframes bounceBack {
            0% { transform: scale(0.94); }
            60% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .back-button .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(2.5); opacity: 0; }
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
                margin: 10px;
            }
            .title { font-size: 1.3em; }
            .avatar {
                width: 100px;
                height: 100px;
            }
            .name { font-size: 1.25em; }
            .info-card { padding: 14px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">自我介绍</div>

        <div class="profile-section">
            <img id="user-avatar" class="avatar" src="https://lime10764.github.io/WMJ10764.github.io/IMG_20251123_220750_388.jpg" alt="覃凌">
            <div class="name">覃凌</div>
            <div class="role">覃凌入口开发者</div>
        </div>

        <div class="info-card">
            <div class="info-item">
                <span class="info-label">姓名</span>
                <span class="info-value"><strong>love</strong>  </span>
            </div>
            <div class="info-item">
                <span class="info-label">备注</span>
                <span class="info-value">作者没留下任何痕迹</span>
            </div>
            <div class="info-item">
                <span class="info-label">邮箱</span>
                <span class="info-value">2267588142@qq.com</span>
            </div>
        </div>

        <div class="description">
            <p>欢迎访问覃凌入口系统。我是这个系统的开发者，致力于为用户提供稳定、便捷的网络服务体验，可以进群讨论。</p>
            <p>系统特点：</p>
            <ul>
                <li>精确的运行时间监控</li>
                <li>多入口访问保障</li>
                <li>实时服务器状态显示</li>
                <li>美观的用户界面</li>
            </ul>
        </div>

        <button class="back-button" id="backBtn">返回主页</button>
    </div>

    <script>
        function setDefaultAvatar() {
            document.getElementById('user-avatar').src = 'https://ui-avatars.com/api/?name=覃凌&background=667eea&color=fff&size=150';
        }

        document.getElementById('user-avatar').addEventListener('error', setDefaultAvatar);

        document.getElementById('backBtn').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);

            this.classList.remove('bounce');
            void this.offsetWidth;
            this.classList.add('bounce');
            setTimeout(() => this.classList.remove('bounce'), 400);

            setTimeout(() => { window.location.href = 'index.html'; }, 200);
        });
    </script>
</body>
</html>
